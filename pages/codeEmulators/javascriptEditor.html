<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JavaScript Web IDE</title>

<script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>

<style>
* {
    box-sizing: border-box;
}

.title {
    padding-left: 8px;
    padding-bottom: 5px;
}

body {
    margin: 0;
    background: #272727;
    color: #272727;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 10px;
    background: #272727;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

div {
    color: white;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    background: #4c6ef5;
    border: none;
    padding: 8px 14px;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

button.stop {
    background: #c92a2a;
}

button.stop:not(:disabled):hover {
    background: #a61e1e;
}

.status {
    font-size: 12px;
    color: #adb5bd;
    min-width: 72px;
}

.status.running {
    color: #ffd166;
}

input[type="file"] {
    color: white;
}

#container {
    flex: 1;
    display: flex;
    overflow: hidden;
}

.panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.panel-title {
    padding: 6px 10px;
    background: white;
    font-size: 13px;
    color: white;
}

#editor {
    flex: 1;
}

#terminal {
    flex: 1;
    padding: 10px;
    background: #0b0d14;
    overflow-y: auto;
    white-space: pre-wrap;
}

.line {
    display: flex;
    align-items: center;
}

.prompt {
    color: #7CFC98;
    margin-right: 8px;
}

input.terminal-input {
    flex: 1;
    background: transparent;
    border: none;
    color: white;
    outline: none;
    font-family: monospace;
    font-size: 14px;
}

.log {
    color: #d4d4d4;
}

.error {
    color: #ff6b6b;
}

.warn {
    color: #ffd166;
}

.info {
    color: #7bdff2;
}

.system {
    color: #868e96;
    font-style: italic;
}

a.nav {
    color: #7bdff2;
    text-decoration: none;
}

a.nav:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<header>
    <div>JavaScript Web IDE 
        <a class="nav" href="/index.html">Simple.rip</a>
        <a class="nav" href="/pages/codeEmulators/selection.html"> Samples </a>
    </div>
       
    <div class="toolbar">
        <label>Upload:</label>
        <input type="file" id="textFileInput" />
        <button onclick="saveProject()">Save</button>
        <button onclick="clearTerminal()">Clear</button>
        <span id="runStatus" class="status" aria-live="polite"></span>
        <button id="stopBtn" class="stop" onclick="stopCode()" disabled>Stop ■</button>
        <button id="runBtn" onclick="runCode()">Run ▶</button>
    </div>
</header>

<div id="container">

    <div class="panel">
        <div class="title">Editor</div>
        <div id="editor"></div>
    </div>

    <div class="panel">
        <div class="title">Console</div>
        <div id="terminal"></div>
    </div>

</div>

<script>
let editor;
let runnerWorker = null;
let runnerUrl = null;
let isRunning = false;
let activePromptInput = null;

// Monaco worker fix
window.MonacoEnvironment = {
    getWorkerUrl: function () {
        return `data:text/javascript;charset=utf-8,
        self.MonacoEnvironment = {
            baseUrl: 'https://unpkg.com/monaco-editor@latest/min/'
        };
        importScripts('https://unpkg.com/monaco-editor@latest/min/vs/base/worker/workerMain.js');`;
    }
};

require.config({
    paths: {
        vs: 'https://unpkg.com/monaco-editor@latest/min/vs'
    }
});

const starterCode = `// JavaScript Web IDE
// Ctrl + Enter to run

console.log("Hello from the browser runtime");

const numbers = [1, 2, 3, 4];

const doubled = numbers.map(n => n * 2);

console.log("Doubled:", doubled);

async function loadData() {
    return new Promise(resolve => {
        setTimeout(() => {
            resolve("Async operation complete");
        }, 1000);
    });
}

loadData().then(console.log);
`;

const RUNNER_SOURCE = `
'use strict';

function serializeArg(arg) {
    if (arg instanceof Error) {
        return arg.stack || String(arg);
    }
    if (typeof arg === 'object' && arg !== null) {
        try {
            return JSON.stringify(arg, null, 2);
        } catch (e) {
            return String(arg);
        }
    }
    return String(arg);
}

function joinArgs(args) {
    return Array.from(args).map(serializeArg).join(' ');
}

const customConsole = {
    log: function () { self.postMessage({ type: 'console', level: 'log', text: joinArgs(arguments) }); },
    error: function () { self.postMessage({ type: 'console', level: 'error', text: joinArgs(arguments) }); },
    warn: function () { self.postMessage({ type: 'console', level: 'warn', text: joinArgs(arguments) }); },
    info: function () { self.postMessage({ type: 'console', level: 'info', text: joinArgs(arguments) }); }
};

const pendingPrompts = new Map();
let promptSeq = 0;

function prompt(message) {
    if (message === undefined || message === null) {
        message = 'Input:';
    }
    return new Promise(function (resolve, reject) {
        var promptId = ++promptSeq;
        pendingPrompts.set(promptId, { resolve: resolve, reject: reject });
        self.postMessage({ type: 'prompt', promptId: promptId, message: String(message) });
    });
}

self.onmessage = async function (event) {
    var msg = event.data;

    if (msg.type === 'prompt-response') {
        var pending = pendingPrompts.get(msg.promptId);
        if (pending) {
            pendingPrompts.delete(msg.promptId);
            pending.resolve(msg.value);
        }
        return;
    }

    if (msg.type === 'prompt-cancel') {
        pendingPrompts.forEach(function (p) {
            p.reject(new Error('Prompt cancelled'));
        });
        pendingPrompts.clear();
        return;
    }

    if (msg.type !== 'run') {
        return;
    }

    try {
        var AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
        var fn = new AsyncFunction(
            'console',
            'setTimeout',
            'setInterval',
            'clearTimeout',
            'clearInterval',
            'Promise',
            'Math',
            'Date',
            'JSON',
            'Array',
            'Object',
            'String',
            'Number',
            'Boolean',
            'RegExp',
            'fetch',
            'prompt',
            msg.code
        );

        await fn(
            customConsole,
            setTimeout,
            setInterval,
            clearTimeout,
            clearInterval,
            Promise,
            Math,
            Date,
            JSON,
            Array,
            Object,
            String,
            Number,
            Boolean,
            RegExp,
            fetch,
            prompt
        );

        self.postMessage({ type: 'done' });
    } catch (err) {
        self.postMessage({
            type: 'error',
            text: (err && err.stack) ? err.stack : String(err)
        });
        self.postMessage({ type: 'done' });
    }
};
`;

hashProjectLoad().then(result => {

    require(['vs/editor/editor.main'], function () {

        editor = monaco.editor.create(document.getElementById('editor'), {
            value: result,
            language: 'javascript',
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            minimap: {
                enabled: false
            }
        });

        editor.addCommand(
            monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
            () => runCode()
        );
    });
});

function saveProject() {
    const content = editor.getValue();

    const blob = new Blob([content], {
        type: 'text/javascript'
    });

    const link = document.createElement('a');

    link.href = URL.createObjectURL(blob);
    link.download = 'project.js';

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function hashProjectLoad() {

    const projectName = window.location.hash.substring(1);

    if (!projectName) {
        return Promise.resolve(starterCode);
    }

    const file = '/pages/codeEmulators/JavascriptSamples/' + projectName + '.js';

    return fetch(file)
        .then(res => {
            if (!res.ok) {
                throw new Error('File not found');
            }

            return res.text();
        })
        .catch(() => starterCode);
}

function clearTerminal() {
    document.getElementById('terminal').innerHTML = '';
}

function write(text, type = 'log') {

    const term = document.getElementById('terminal');

    const line = document.createElement('div');
    line.className = type;

    if (typeof text === 'object') {
        try {
            line.textContent = JSON.stringify(text, null, 2);
        } catch {
            line.textContent = String(text);
        }
    } else {
        line.textContent = String(text);
    }

    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
}

function setRunning(running) {
    isRunning = running;

    const runBtn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('runStatus');

    runBtn.disabled = running;
    stopBtn.disabled = !running;
    status.textContent = running ? 'Running…' : '';
    status.classList.toggle('running', running);
}

function destroyWorker() {
    if (runnerWorker) {
        runnerWorker.onmessage = null;
        runnerWorker.onerror = null;
        runnerWorker.terminate();
        runnerWorker = null;
    }

    if (runnerUrl) {
        URL.revokeObjectURL(runnerUrl);
        runnerUrl = null;
    }

    if (activePromptInput) {
        activePromptInput.disabled = true;
        activePromptInput = null;
    }
}

function createPrompt(questionText = '') {

    return new Promise(resolve => {

        const term = document.getElementById('terminal');

        const line = document.createElement('div');
        line.className = 'line';

        const prompt = document.createElement('span');
        prompt.className = 'prompt';
        prompt.textContent = questionText || '>';

        const input = document.createElement('input');
        input.className = 'terminal-input';

        line.appendChild(prompt);
        line.appendChild(input);

        term.appendChild(line);

        activePromptInput = input;
        input.focus();

        input.addEventListener('keydown', e => {

            if (e.key === 'Enter') {

                const value = input.value;

                input.disabled = true;
                if (activePromptInput === input) {
                    activePromptInput = null;
                }

                resolve(value);
            }
        });

        term.scrollTop = term.scrollHeight;
    });
}

function handleWorkerMessage(event) {
    const msg = event.data;

    if (msg.type === 'console') {
        write(msg.text, msg.level || 'log');
        return;
    }

    if (msg.type === 'error') {
        write(msg.text, 'error');
        return;
    }

    if (msg.type === 'prompt') {
        createPrompt(msg.message).then(value => {
            if (runnerWorker) {
                runnerWorker.postMessage({
                    type: 'prompt-response',
                    promptId: msg.promptId,
                    value
                });
            }
        });
        return;
    }

    if (msg.type === 'done') {
        setRunning(false);
        destroyWorker();
    }
}

function stopCode(reason = 'Execution stopped.') {
    if (!isRunning && !runnerWorker) {
        return;
    }

    destroyWorker();
    setRunning(false);
    write(reason, 'system');
}

async function runCode() {
    if (!editor) {
        return;
    }

    if (isRunning) {
        stopCode('Previous run aborted.');
    }

    clearTerminal();

    const code = editor.getValue();

    const blob = new Blob([RUNNER_SOURCE], { type: 'application/javascript' });
    runnerUrl = URL.createObjectURL(blob);
    runnerWorker = new Worker(runnerUrl);

    runnerWorker.onmessage = handleWorkerMessage;

    runnerWorker.onerror = (err) => {
        write(err.message || 'Worker error', 'error');
        setRunning(false);
        destroyWorker();
    };

    setRunning(true);
    runnerWorker.postMessage({ type: 'run', code });
}

// File upload

document.getElementById('textFileInput').addEventListener('change', event => {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = e => {
        editor.setValue(e.target.result);
    };

    reader.readAsText(file);
});

window.addEventListener('hashchange', async () => {

    const code = await hashProjectLoad();

    if (editor) {
        editor.setValue(code);
    }
});

window.addEventListener('keydown', e => {
    if ((e.key === 'Escape' || e.key === 'Esc') && isRunning) {
        stopCode();
    }
});
</script>

</body>
</html>
