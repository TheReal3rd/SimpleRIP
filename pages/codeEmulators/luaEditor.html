<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lua Web IDE</title>

<script src="https://unpkg.com/fengari-web@0.1.4/dist/fengari-web.js"></script>
<script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>

<style>
* {
    box-sizing: border-box;
}

.title {
    padding-left: 8px;
    padding-bottom: 5px;
}

body {
    margin: 0;
    background: #272727;
    color: #272727;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 10px;
    background: #272727;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

div {
    color: white;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    background: #4c6ef5;
    border: none;
    padding: 8px 14px;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #3b5bdb;
}

input[type="file"] {
    color: white;
}

#container {
    flex: 1;
    display: flex;
    overflow: hidden;
}

.panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#editor {
    flex: 1;
}

#terminal {
    flex: 1;
    padding: 10px;
    background: #0b0d14;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 14px;
}

.line {
    display: flex;
    align-items: center;
}

.prompt {
    color: #7CFC98;
    margin-right: 8px;
}

input.terminal-input {
    flex: 1;
    background: transparent;
    border: none;
    color: white;
    outline: none;
    font-family: monospace;
    font-size: 14px;
}

.log {
    color: #d4d4d4;
}

.error {
    color: #ff6b6b;
}

.warn {
    color: #ffd166;
}

.info {
    color: #7bdff2;
}
</style>
</head>

<body>

<header>
    <div>Lua Web IDE <a href="/pages/codeEmulators/selection.html" style="color:#7bdff2;text-decoration:none;margin-left:12px;"> Samples </a></div>

    <div class="toolbar">
        <label>Upload:</label>
        <input type="file" id="textFileInput" accept=".lua,.txt" />

        <button onclick="saveProject()">Save</button>
        <button onclick="clearTerminal()">Clear</button>
        <button onclick="runCode()">Run ▶</button>
    </div>
</header>

<div id="container">

    <div class="panel">
        <div class="title">Editor</div>
        <div id="editor"></div>
    </div>

    <div class="panel">
        <div class="title">Console</div>
        <div id="terminal"></div>
    </div>

</div>

<script>
let editor;

window.MonacoEnvironment = {
    getWorkerUrl: function () {
        return `data:text/javascript;charset=utf-8,
        self.MonacoEnvironment = {
            baseUrl: 'https://unpkg.com/monaco-editor@latest/min/'
        };
        importScripts('https://unpkg.com/monaco-editor@latest/min/vs/base/worker/workerMain.js');`;
    }
};

require.config({
    paths: {
        vs: 'https://unpkg.com/monaco-editor@latest/min/vs'
    }
});

const starterCode = `-- Lua Web IDE
-- Ctrl + Enter to run

print("Hello from the Lua runtime")

local numbers = {1, 2, 3, 4}

local doubled = {}
for i, n in ipairs(numbers) do
    doubled[i] = n * 2
end

print("Doubled:", table.concat(doubled, ", "))

local function greet(name)
    return "Hello, " .. name .. "!"
end

print(greet("Lua"))

-- Optional: input("Your name: ") opens a prompt dialog
`;

hashProjectLoad().then(result => {

    require(['vs/editor/editor.main'], function () {

        editor = monaco.editor.create(document.getElementById('editor'), {
            value: result,
            language: 'lua',
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            minimap: {
                enabled: false
            }
        });

        editor.addCommand(
            monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
            () => runCode()
        );
    });
});

function saveProject() {
    const content = editor.getValue();

    const blob = new Blob([content], {
        type: 'text/x-lua'
    });

    const link = document.createElement('a');

    link.href = URL.createObjectURL(blob);
    link.download = 'project.lua';

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function hashProjectLoad() {

    const projectName = window.location.hash.substring(1);

    if (!projectName) {
        return Promise.resolve(starterCode);
    }

    const file = '/pages/codeEmulators/LuaSamples/' + projectName + '.lua';

    return fetch(file)
        .then(res => {
            if (!res.ok) {
                throw new Error('File not found');
            }

            return res.text();
        })
        .catch(() => starterCode);
}

function clearTerminal() {
    document.getElementById('terminal').innerHTML = '';
}

function write(text, type = 'log') {

    const term = document.getElementById('terminal');

    const line = document.createElement('div');
    line.className = type;

    if (typeof text === 'object') {
        try {
            line.textContent = JSON.stringify(text, null, 2);
        } catch {
            line.textContent = String(text);
        }
    } else {
        line.textContent = String(text);
    }

    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
}

window.__luaWrite = function (text, type) {
    if (text != null && typeof text !== 'string') {
        if (typeof fengari !== 'undefined' && fengari.to_jsstring) {
            try {
                text = fengari.to_jsstring(text);
            } catch {
                text = String(text);
            }
        } else {
            text = String(text);
        }
    }
    write(text == null ? '' : String(text), type || 'log');
};

async function runCode() {

    clearTerminal();

    if (typeof fengari === 'undefined' || typeof fengari.load !== 'function') {
        write('Lua runtime failed to load (fengari). Refresh the page.', 'error');
        return;
    }

    const code = editor.getValue();

    try {

        const prelude = `
local js = require "js"

local function write_to_console(text, kind)
    js.global:__luaWrite(tostring(text), kind)
end

function print(...)
    local n = select("#", ...)
    local parts = {}
    for i = 1, n do
        parts[i] = tostring(select(i, ...))
    end
    write_to_console(table.concat(parts, "\\t"), "log")
end

function warn(...)
    local n = select("#", ...)
    local parts = {}
    for i = 1, n do
        parts[i] = tostring(select(i, ...))
    end
    write_to_console(table.concat(parts, "\\t"), "warn")
end

function input(message)
    message = message or ">"
    write_to_console(tostring(message), "info")
    local result = js.global:prompt(tostring(message), "")
    if result == nil then
        return ""
    end
    write_to_console("> " .. tostring(result), "log")
    return tostring(result)
end
`;

        fengari.load(prelude + "\n" + code)();

    } catch (err) {
        write(err.message || err.toString(), 'error');
    }
}

document.getElementById('textFileInput').addEventListener('change', event => {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = e => {
        editor.setValue(e.target.result);
    };

    reader.readAsText(file);
});

window.addEventListener('hashchange', async () => {

    const code = await hashProjectLoad();

    if (editor) {
        editor.setValue(code);
    }
});
</script>

</body>
</html>
