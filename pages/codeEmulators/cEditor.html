<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Web IDE</title>

<script src="https://cdn.jsdelivr.net/npm/JSCPP@2.0.6/dist/JSCPP.es5.min.js"></script>
<script src="/pages/codeEmulators/Libraries/c-runtime.js"></script>
<script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>

<style>
* {
    box-sizing: border-box;
}

.title {
    padding-left: 8px;
    padding-bottom: 5px;
}

body {
    margin: 0;
    background: #272727;
    color: #272727;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 10px;
    background: #272727;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

div {
    color: white;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    background: #4c6ef5;
    border: none;
    padding: 8px 14px;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #3b5bdb;
}

input[type="file"] {
    color: white;
}

a.nav {
    color: #7bdff2;
    text-decoration: none;
}

a.nav:hover {
    text-decoration: underline;
}

#container {
    flex: 1;
    display: flex;
    overflow: hidden;
}

.panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#editor {
    flex: 1;
}

#terminal {
    flex: 1;
    padding: 10px;
    background: #0b0d14;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 14px;
}

.log {
    color: #d4d4d4;
}

.error {
    color: #ff6b6b;
}

.warn {
    color: #ffd166;
}

.info {
    color: #7bdff2;
}
</style>
</head>

<body>

<header>
    <div class="toolbar">
        <div>C Web IDE</div>
        <a class="nav" href="/index.html">Simple.rip</a>
        <a class="nav" href="/pages/codeEmulators/selection.html">Samples</a>
        <a class="nav" href="/pages/codeEmulators/c-packages.html">Packages</a>
    </div>

    <div class="toolbar">
        <label>Upload:</label>
        <input type="file" id="textFileInput" accept=".c,.h,.cpp,.txt" />

        <button onclick="saveProject()">Save</button>
        <button onclick="clearTerminal()">Clear</button>
        <button id="stopBtn" onclick="stopCode()" disabled>Stop ■</button>
        <button id="runBtn" onclick="runCode()">Run ▶</button>
    </div>
</header>

<div id="container">

    <div class="panel">
        <div class="title">Editor</div>
        <div id="editor"></div>
    </div>

    <div class="panel">
        <div class="title">Console</div>
        <div id="terminal"></div>
    </div>

</div>

<script>
let editor;
let runnerWorker = null;
let runnerUrl = null;
let isRunning = false;

window.MonacoEnvironment = {
    getWorkerUrl: function () {
        return `data:text/javascript;charset=utf-8,
        self.MonacoEnvironment = {
            baseUrl: 'https://unpkg.com/monaco-editor@latest/min/'
        };
        importScripts('https://unpkg.com/monaco-editor@latest/min/vs/base/worker/workerMain.js');`;
    }
};

require.config({
    paths: {
        vs: 'https://unpkg.com/monaco-editor@latest/min/vs'
    }
});

const starterCode = `/* C Web IDE
 * Ctrl + Enter to run
 */

#include <stdio.h>

int main() {
    printf("Hello from the C runtime\\n");
    printf("See Packages for available headers (stdio, string, stdlib, ...)\\n");

    int numbers[] = {1, 2, 3, 4};
    int n = 4;

    printf("Doubled:");
    for (int i = 0; i < n; i++) {
        printf(" %d", numbers[i] * 2);
    }
    printf("\\n");

    return 0;
}
`;

hashProjectLoad().then(result => {

    require(['vs/editor/editor.main'], function () {

        editor = monaco.editor.create(document.getElementById('editor'), {
            value: result,
            language: 'c',
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            minimap: {
                enabled: false
            }
        });

        editor.addCommand(
            monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
            () => runCode()
        );
    });
});

function saveProject() {
    const content = editor.getValue();

    const blob = new Blob([content], {
        type: 'text/x-c'
    });

    const link = document.createElement('a');

    link.href = URL.createObjectURL(blob);
    link.download = 'project.c';

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function hashProjectLoad() {

    const projectName = window.location.hash.substring(1);

    if (!projectName) {
        return Promise.resolve(starterCode);
    }

    const file = 'CSamples/' + projectName + '.c';

    return fetch(file)
        .then(res => {
            if (!res.ok) {
                throw new Error('File not found');
            }

            return res.text();
        })
        .catch(() => starterCode);
}

function clearTerminal() {
    document.getElementById('terminal').innerHTML = '';
}

function write(text, type = 'log') {

    const term = document.getElementById('terminal');

    const line = document.createElement('div');
    line.className = type;
    line.textContent = text == null ? '' : String(text);

    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
}

function writeRaw(text, type = 'log') {
    const term = document.getElementById('terminal');
    const line = document.createElement('div');
    line.className = type;
    line.style.whiteSpace = 'pre-wrap';
    line.textContent = text == null ? '' : String(text);
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
}

function needsStdin(code) {
    return /\b(scanf|gets|getchar|cin\s*>>)/.test(code);
}

function setRunning(running) {
    isRunning = running;
    document.getElementById('runBtn').disabled = running;
    document.getElementById('stopBtn').disabled = !running;
}

function destroyWorker() {
    if (runnerWorker) {
        runnerWorker.onmessage = null;
        runnerWorker.onerror = null;
        runnerWorker.terminate();
        runnerWorker = null;
    }
    if (runnerUrl) {
        URL.revokeObjectURL(runnerUrl);
        runnerUrl = null;
    }
}

function stopCode(reason) {
    if (!isRunning && !runnerWorker) {
        return;
    }
    destroyWorker();
    setRunning(false);
    write(reason || 'Execution stopped.', 'warn');
}

const C_RUNNER_SOURCE = `
'use strict';

var window = self;
var document = self;

self.onmessage = function (event) {
    var msg = event.data;
    if (msg.type !== 'run') return;

    try {
        importScripts(msg.jscppUrl);
        importScripts(msg.runtimeUrl);
    } catch (err) {
        self.postMessage({ type: 'console', level: 'error', text: 'Failed to load C runtime: ' + (err && err.message ? err.message : err) });
        self.postMessage({ type: 'done' });
        return;
    }

    if (typeof JSCPP === 'undefined' || typeof JSCPP.run !== 'function') {
        self.postMessage({ type: 'console', level: 'error', text: 'C runtime failed to load (JSCPP). Refresh the page.' });
        self.postMessage({ type: 'done' });
        return;
    }

    if (typeof CIdeRuntime === 'undefined' || !CIdeRuntime.ensureHeapExtensions(JSCPP)) {
        self.postMessage({ type: 'console', level: 'warn', text: 'Warning: c-runtime.js heap extensions not loaded.' });
    }

    try {
        var result = CIdeRuntime.runC(JSCPP, msg.code, msg.stdin || '');
        var buffer = result.stdout || '';

        if (buffer.length) {
            var parts = buffer.replace(/\\r\\n/g, '\\n').split('\\n');
            for (var i = 0; i < parts.length; i++) {
                if (i === parts.length - 1 && parts[i] === '') {
                    continue;
                }
                self.postMessage({ type: 'console', level: 'log', text: parts[i] });
            }
        }

        self.postMessage({ type: 'console', level: 'info', text: 'Program exited with code ' + result.exitCode });
    } catch (err) {
        self.postMessage({ type: 'console', level: 'error', text: (err && err.message) ? err.message : String(err) });
    }

    self.postMessage({ type: 'done' });
};
`;

function handleWorkerMessage(event) {
    const msg = event.data;

    if (msg.type === 'console') {
        write(msg.text, msg.level || 'log');
        return;
    }

    if (msg.type === 'done') {
        setRunning(false);
        destroyWorker();
    }
}

async function runCode() {

    if (!editor) {
        return;
    }

    if (isRunning) {
        stopCode('Previous run aborted.');
    }

    clearTerminal();

    const code = editor.getValue();
    let stdin = '';

    if (needsStdin(code)) {
        const typed = window.prompt('Program stdin (for scanf / cin):', '');
        if (typed === null) {
            write('Run cancelled.', 'warn');
            return;
        }
        stdin = typed;
        write('stdin: ' + JSON.stringify(stdin), 'info');
    }

    const blob = new Blob([C_RUNNER_SOURCE], { type: 'application/javascript' });
    runnerUrl = URL.createObjectURL(blob);
    runnerWorker = new Worker(runnerUrl);

    runnerWorker.onmessage = handleWorkerMessage;
    runnerWorker.onerror = (err) => {
        write(err.message || 'Worker error', 'error');
        setRunning(false);
        destroyWorker();
    };

    setRunning(true);
    runnerWorker.postMessage({
        type: 'run',
        code,
        stdin,
        jscppUrl: 'https://cdn.jsdelivr.net/npm/JSCPP@2.0.6/dist/JSCPP.es5.min.js',
        runtimeUrl: new URL('/pages/codeEmulators/Libraries/c-runtime.js', window.location.origin).href
    });
}

document.getElementById('textFileInput').addEventListener('change', event => {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = e => {
        editor.setValue(e.target.result);
    };

    reader.readAsText(file);
});

window.addEventListener('hashchange', async () => {

    const code = await hashProjectLoad();

    if (editor) {
        editor.setValue(code);
    }
});

window.addEventListener('keydown', e => {
    if ((e.key === 'Escape' || e.key === 'Esc') && isRunning) {
        stopCode();
    }
});
</script>

</body>
</html>
