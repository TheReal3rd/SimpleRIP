<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pygame Web IDE</title>
<link rel="stylesheet" href="vendor/monaco/vs/editor/editor.main.css">
<script src="vendor/monaco/vs/loader.js"></script>
<style>
:root {
    color-scheme: dark;
    --bg: #272727;
    --panel: #1b1d22;
    --ink: #e8eef8;
    --muted: #9aa6ba;
    --line: #343844;
    --accent: #4c6ef5;
    --good: #2f9e6b;
    --stop: #d35454;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 10px 12px;
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
}

.brand { display: flex; flex-direction: column; gap: 2px; min-width: 180px; }
.brand strong { font-size: 15px; }
.hint { color: var(--muted); font-size: 12px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
label.file { color: var(--ink); font-size: 12px; }
input[type="file"] { color: var(--muted); max-width: 180px; }
select, button {
    background: #31343c;
    border: 1px solid var(--line);
    color: white;
    border-radius: 6px;
    padding: 8px 12px;
    font: inherit;
}
button { background: var(--accent); border: none; cursor: pointer; }
button:disabled { opacity: 0.45; cursor: default; }
#runBtn { background: var(--good); }
#stopBtn { background: var(--stop); }
#runState { color: var(--muted); font-size: 12px; min-width: 64px; }

#container { display: flex; flex: 1; min-height: 0; }
.panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.panel + .panel { border-left: 1px solid var(--line); }
.title {
    padding: 6px 10px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
}
#editor { flex: 1; min-height: 0; }
#stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #12151c;
    padding: 12px;
}
#window {
    display: flex;
    flex-direction: column;
    max-width: 100%;
    max-height: 100%;
    min-height: 0;
    background: #000;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
}
#caption {
    background: #1c2230;
    color: #d5ddee;
    font-size: 12px;
    padding: 5px 8px;
}
#screenHost { min-height: 0; }
#screenHost canvas {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 280px);
    background: #000;
    outline: none;
}
#terminal {
    height: 168px;
    padding: 10px;
    background: #0b0d14;
    overflow-y: auto;
    white-space: pre-wrap;
    border-top: 1px solid var(--line);
}
.line { display: flex; }
.prompt { color: #7CFC98; margin-right: 6px; }
input.terminal-input {
    background: transparent;
    border: none;
    color: white;
    outline: none;
    flex: 1;
    font: inherit;
}
.error { color: #ff8d8d; }
.info { color: #8fb4d6; }
#assetList { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 8px; }
.chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #2a3142;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
}
.chip button {
    background: transparent;
    padding: 0 2px;
    color: #ffb4b4;
}

@media (max-width: 900px) {
    header { align-items: flex-start; flex-direction: column; }
    .tools { justify-content: flex-start; }
    #container { flex-direction: column; }
    .panel + .panel { border-left: none; border-top: 1px solid var(--line); }
    #editor { min-height: 280px; }
    #screenHost canvas { max-height: 50vh; }
}
</style>
</head>
<body>
<header>
    <div class="brand">
        <strong>Pygame Web IDE</strong>
        <span class="hint">Python and pygame stay in this browser</span>
    </div>
    <div class="tools">
        <label class="file">Sample
            <select id="sampleSelect" aria-label="Sample program"></select>
        </label>
        <label class="file">Script <input type="file" id="textFileInput" accept=".py,.txt"></label>
        <label class="file">Images &amp; sounds <input type="file" id="assetInput" multiple accept="image/*,audio/*,.ttf,.otf,.wav,.mp3,.ogg"></label>
        <button id="saveBtn" type="button">Save</button>
        <button id="pngBtn" type="button">Save PNG</button>
        <button id="clearBtn" type="button">Clear</button>
        <span id="runState">Ready</span>
        <button id="stopBtn" type="button" disabled>Stop</button>
        <button id="runBtn" type="button">Run</button>
    </div>
</header>
<div id="container">
    <div class="panel">
        <div class="title"><span>Editor</span><span>Ctrl+Enter runs</span></div>
        <div id="editor"></div>
    </div>
    <div class="panel">
        <div class="title"><span>Window</span><span>Click it, then use the keyboard</span></div>
        <div id="assetList"></div>
        <div id="stage">
            <div id="window">
                <div id="caption">pygame</div>
                <div id="screenHost"></div>
            </div>
        </div>
        <div class="title"><span>Terminal</span></div>
        <div id="terminal"></div>
    </div>
</div>
<script src="/pages/codeEmulators/Libraries/ide.js"></script>
</body>
</html>
