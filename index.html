<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple.rip</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<header>
simple.rip
</header>

<main>
<div class="subtitle">
    Keep It Simple Stupid!
</div>

<section class="tool-group">

    <h2>Image Tools</h2>

    <div class="button-container">

        <button
            data-tooltip="Convert images into arcade.makecode.com image format."
            onclick="window.location.href='/pages/ImageToArcade.html'">
            Arcade Converter
        </button>

        <button
            data-tooltip="Convert images for ComputerCraft."
            onclick="window.location.href='/pages/ImageToCC.html'">
            ComputerCraft Converter
        </button>

    </div>

</section>

<section class="tool-group">

    <h2>Web IDEs</h2>

    <div class="button-container">

        <button
            data-tooltip="Python editor."
            onclick="window.location.href='/pages/codeEmulators/pythonEditor.html'">
            Python
        </button>

        <button
            data-tooltip="JavaScript editor."
            onclick="window.location.href='/pages/codeEmulators/javascriptEditor.html'">
            JavaScript
        </button>

        <button
            data-tooltip="Pixi.js rendering playground."
            onclick="window.location.href='/pages/codeEmulators/pixiEditor.html'">
            Pixi.js
        </button>

        <button
            data-tooltip="Three.js 3D editor."
            onclick="window.location.href='/pages/codeEmulators/threeEditor.html'">
            Three.js
        </button>

        <button
            data-tooltip="Pixel canvas editor."
            onclick="window.location.href='/pages/codeEmulators/javascriptCanvasEditor.html'">
            Pixel.js
        </button>

        <button
            data-tooltip="Lua editor."
            onclick="window.location.href='/pages/codeEmulators/luaEditor.html'">
            Lua
        </button>

        <button
            data-tooltip="C editor."
            onclick="window.location.href='/pages/codeEmulators/cEditor.html'">
            C
        </button>

    </div>

</section>

<section class="tool-group">

    <h2>Wikis & Links</h2>

    <div class="button-container">

        <button
            data-tooltip="Programming wiki and documentation."
            onclick="window.location.href='/pages/codingWiki/articleViewer.html'">
            Coding Wiki (WIP)
        </button>

    </div>

</section>

<section class="tool-group">

    <h2>Fun</h2>

    <div class="button-container">

        <button
            data-tooltip="Basic Music generator using patterns and javascript."
            onclick="window.location.href='/pages/funStuff/musicEditor.html'">
            Music Lab
        </button>

    </div>

</section>
</main>

<footer>
About: Collection of tools and projects.
</footer>

</body>
</html>
